<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Poppins:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>Dashboard</h1>
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="calendar-view">Calendar</button>
      <button class="tab-btn" data-tab="weekly-view">Weekly To-Dos</button>
    </nav>
    <div class="header-actions">
      <button id="refresh-btn" class="btn btn-ghost" title="Refresh Canvas data">Refresh</button>
      <button id="settings-btn" class="btn btn-ghost" title="Settings">Settings</button>
    </div>
  </header>

  <main id="calendar-view" class="layout tab-view">
    <section class="panel calendar-panel">
      <div class="panel-header">
        <h2>Calendar</h2>
        <button id="add-event-btn" class="btn btn-small">+ Add event</button>
      </div>
      <div id="calendar"></div>
    </section>

    <aside class="sidebar">
      <section class="panel">
        <div class="panel-header">
          <h2>Announcements</h2>
        </div>
        <div id="announcements-list" class="list"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Grades</h2>
          <button id="add-grade-btn" class="btn btn-small">+ Add</button>
        </div>
        <div id="grades-list" class="list"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>To-dos</h2>
        </div>
        <form id="todo-form" class="inline-form">
          <input type="text" id="todo-title" placeholder="Add a to-do..." required />
          <input type="date" id="todo-date" />
          <button type="submit" class="btn btn-small">Add</button>
        </form>
        <div id="todo-list" class="list"></div>
      </section>
    </aside>
  </main>

  <section id="weekly-view" class="tab-view" hidden>
    <div class="weekly-header">
      <h2 id="weekly-range"></h2>
    </div>
    <div id="weekly-grid" class="weekly-grid"></div>

    <div class="weekly-horizon-panel">
      <div class="weekly-horizon-header">
        <div class="weekly-col-title">Horizon</div>
        <div class="weekly-col-subtitle">stays until you delete it</div>
      </div>
      <form id="horizon-add-form" class="weekly-add-form">
        <input type="text" placeholder="Add something to Horizon..." required />
      </form>
      <div id="weekly-horizon-list" class="weekly-list weekly-horizon-list"></div>
    </div>
  </section>
</div>

<dialog id="setup-modal" class="modal">
  <form id="setup-form" class="modal-form">
    <h2>Connect Canvas</h2>
    <p class="muted">
      Generate a token in Canvas under Account &rarr; Settings &rarr; New Access Token.
      Stored locally in <code>data/config.json</code>, never sent anywhere but Canvas.
    </p>
    <label>
      Canvas domain
      <input type="text" id="canvas-domain" placeholder="canvas.stanford.edu" required />
    </label>
    <label>
      Access token
      <input type="password" id="canvas-token" required />
    </label>
    <p id="setup-error" class="error" hidden></p>
    <div class="modal-actions">
      <button type="button" id="setup-cancel" class="btn btn-ghost">Cancel</button>
      <button type="submit" class="btn btn-primary">Save &amp; Connect</button>
    </div>
  </form>
</dialog>

<dialog id="grade-modal" class="modal">
  <form id="grade-form" class="modal-form">
    <h2 id="grade-modal-title">Add grade</h2>
    <input type="hidden" id="grade-id" />
    <label>
      Course
      <input type="text" id="grade-course" placeholder="CS 106B" required />
    </label>
    <label>
      Item name
      <input type="text" id="grade-item-name" placeholder="Midterm 1" required />
    </label>
    <label>
      Type
      <select id="grade-item-type">
        <option value="assignment">Assignment</option>
        <option value="quiz">Quiz</option>
        <option value="midterm">Midterm</option>
        <option value="final">Final</option>
        <option value="other">Other</option>
      </select>
    </label>
    <label>
      Your score <span class="muted">(any format — 92%, 45/50, Check+...)</span>
      <input type="text" id="grade-score" placeholder="leave blank if not graded yet" />
    </label>
    <label>
      Class median <span class="muted">(optional)</span>
      <input type="text" id="grade-median" placeholder="leave blank if not released" />
    </label>
    <label>
      Comment <span class="muted">(optional)</span>
      <textarea id="grade-comment" rows="2"></textarea>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="grade-hidden" />
      Hide this grade by default
    </label>
    <div class="modal-actions">
      <button type="button" id="grade-delete" class="btn btn-danger" hidden>Delete</button>
      <button type="button" id="grade-cancel" class="btn btn-ghost">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="event-modal" class="modal">
  <form id="event-form" class="modal-form">
    <h2 id="event-modal-title">Add event</h2>
    <input type="hidden" id="event-id" />
    <label>
      Title
      <input type="text" id="event-title" placeholder="CS 106B Lecture" required />
    </label>
    <label>
      Date
      <input type="date" id="event-date" required />
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="event-all-day" />
      All day
    </label>
    <div id="event-time-fields" class="inline-fields">
      <label>
        Start time
        <input type="time" id="event-start-time" />
      </label>
      <label>
        End time
        <input type="time" id="event-end-time" />
      </label>
    </div>
    <label>
      Location <span class="muted">(optional)</span>
      <input type="text" id="event-location" placeholder="Gates B01" />
    </label>
    <label>
      Notes <span class="muted">(optional)</span>
      <textarea id="event-notes" rows="2"></textarea>
    </label>
    <label>
      Repeats
      <select id="event-repeat-freq">
        <option value="none">Does not repeat</option>
        <option value="weekly">Weekly</option>
      </select>
    </label>
    <label id="event-repeat-days-field">
      Repeat on
      <div id="event-repeat-days" class="weekday-picker">
        <label class="weekday-chip"><input type="checkbox" value="SU" />Su</label>
        <label class="weekday-chip"><input type="checkbox" value="MO" />Mo</label>
        <label class="weekday-chip"><input type="checkbox" value="TU" />Tu</label>
        <label class="weekday-chip"><input type="checkbox" value="WE" />We</label>
        <label class="weekday-chip"><input type="checkbox" value="TH" />Th</label>
        <label class="weekday-chip"><input type="checkbox" value="FR" />Fr</label>
        <label class="weekday-chip"><input type="checkbox" value="SA" />Sa</label>
      </div>
    </label>
    <label id="event-repeat-until-field">
      Repeat until
      <input type="date" id="event-repeat-until" />
    </label>
    <p id="event-error" class="error" hidden></p>
    <input type="hidden" id="event-occurrence-date" />
    <div class="modal-actions">
      <button type="button" id="event-delete-occurrence" class="btn btn-danger" hidden>Delete this date</button>
      <button type="button" id="event-delete-series" class="btn btn-danger" hidden>Delete</button>
      <button type="button" id="event-cancel" class="btn btn-ghost">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
